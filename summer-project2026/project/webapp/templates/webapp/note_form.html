<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ page_title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="h3 mb-4">
                            {{ page_title }}
                        </h1>

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">
                                    Note Title
                                </label>

                                {{ form.title }}
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Class
                                </label>

                                {{ form.class_name }}
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Notes
                                </label>

                                {{ form.content }}
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Note
                            </button>

                            <a
                                href="{% url 'notes_list' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </main>

</body>
</html>

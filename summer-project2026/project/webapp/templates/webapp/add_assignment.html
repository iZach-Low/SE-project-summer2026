{% extends "webapp/base.html" %}
{% block title %}Add Assignment{% endblock %}

{% comment %} All the page's old <style> block is GONE — base.html provides
   the parchment card, fonts, gold buttons, input styling, and error styling
   for every page now. This page keeps only its unique content. {% endcomment %}
{% block content %}
<main class="container py-5">
    <div class="card mx-auto" style="max-width: 460px; padding: 40px 42px;">

        <h1 class="h3">Add Assignment</h1>
        <p class="text-muted mb-4">Catalog a new deadline in your study ledger.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            {% comment %} Date-format hint kept from before {% endcomment %}
            <p class="text-muted" style="font-size: 0.8rem; font-style: italic;">
                Date format: YYYY-MM-DD HH:MM (e.g. 2026-08-19 14:30)
            </p>

            <button type="submit" class="btn btn-primary w-100 mt-2">Add to Ledger</button>
        </form>

        <a href="{% url 'home' %}" class="d-block text-center mt-3">Back to Home</a>

    </div>
</main>
{% endblock %}

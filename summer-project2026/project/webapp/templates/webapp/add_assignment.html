<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Assignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Lora", Georgia, serif;
            color: #3b2f2a;
            /* Layered warm-wood / dim-library-lighting background */
            background-color: #2e211a;
            background-image:
                radial-gradient(ellipse at top, rgba(120, 85, 55, 0.45), transparent 60%),
                repeating-linear-gradient(
                    90deg,
                    #3a2a1e 0px,
                    #3a2a1e 38px,
                    #34251a 38px,
                    #34251a 76px
                );
        }
        .card {
            position: relative;
            background-color: #f4ecd8;
            background-image:
                radial-gradient(circle at 20% 15%, rgba(200, 175, 130, 0.25), transparent 40%),
                radial-gradient(circle at 80% 85%, rgba(160, 130, 90, 0.20), transparent 45%);
            width: 100%;
            max-width: 460px;
            margin: 24px;
            padding: 40px 42px;
            border-radius: 6px;
            border: 1px solid #d8c9a3;
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.55),
                inset 0 0 60px rgba(180, 150, 100, 0.15);
        }
        /* Thin gold rule near the top edge, like a book plate */
        .card::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 42px;
            right: 42px;
            height: 2px;
            background: linear-gradient(
                to right,
                transparent,
                #b08d3f 20%,
                #b08d3f 80%,
                transparent
            );
        }
        h1 {
            font-family: "Playfair Display", Georgia, serif;
            margin: 14px 0 4px;
            font-size: 2rem;
            font-weight: 700;
            color: #4a3524;
            letter-spacing: 0.5px;
        }
        .subtitle {
            margin: 0 0 26px;
            font-size: 0.92rem;
            font-style: italic;
            color: #7a6650;
        }
        form p {
            margin: 0 0 18px;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #5a4632;
            letter-spacing: 0.3px;
        }
        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #c9b48a;
            border-radius: 4px;
            background-color: #fdfaf1;
            font-family: "Lora", Georgia, serif;
            font-size: 0.95rem;
            color: #3b2f2a;
            box-sizing: border-box;
        }
        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #b08d3f;
            box-shadow: 0 0 0 3px rgba(176, 141, 63, 0.20);
        }
        form input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            vertical-align: middle;
            accent-color: #8a6d2f;
        }
        .form-hint {
            margin: -10px 0 20px;
            font-size: 0.8rem;
            font-style: italic;
            color: #9a866a;
        }
        ul.errorlist {
            list-style: none;
            margin: 0 0 8px;
            padding: 8px 12px;
            background-color: #f6e2d8;
            border: 1px solid #d9a58a;
            border-radius: 4px;
            color: #8a3520;
            font-size: 0.85rem;
        }
        ul.errorlist li { margin: 0; }
        button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: linear-gradient(#a9832f, #8a6d2f);
            color: #fdfaf1;
            border: 1px solid #6f5622;
            border-radius: 5px;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.05s ease;
        }
        button[type="submit"]:hover {
            filter: brightness(1.08);
        }
        button[type="submit"]:active {
            transform: translateY(1px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            font-style: italic;
            color: #7a6650;
            text-decoration: none;
        }
        .back-link:hover {
            color: #4a3524;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Add Assignment</h1>
        <p class="subtitle">Catalog a new deadline in your study ledger.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="form-hint">
                Date format: YYYY-MM-DD HH:MM (e.g. 2026-08-19 14:30)
            </p>
            <button type="submit">
                Add to Ledger
            </button>
        </form>
        <a class="back-link" href="{% url 'home' %}">
            Back to Home
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ page_title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #302316;
            color: #21170e;
        }

        .assignment-form-card {
            background-color: #f4ecd5;
            border-radius: 12px;
            border: 1px solid #aa842c;
        }

        .btn-gold {
            background-color: #a88228;
            color: white;
            border-color: #8c6c1f;
        }

        .btn-gold:hover {
            background-color: #8c6c1f;
            color: white;
        }
    </style>
</head>

<body>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="assignment-form-card p-4">

                    <h1 class="h2 mb-4">
                        {{ page_title }}
                    </h1>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="{{ form.title.id_for_label }}"
                                class="form-label"
                            >
                                Assignment Title
                            </label>

                            {{ form.title }}

                        </div>

                        <div class="mb-3">

                            <label
                                for="{{ form.class_name.id_for_label }}"
                                class="form-label"
                            >
                                Class
                            </label>

                            {{ form.class_name }}

                        </div>

                        <div class="mb-4">

                            <label
                                for="{{ form.due_date.id_for_label }}"
                                class="form-label"
                            >
                                Due Date and Time
                            </label>

                            {{ form.due_date }}

                        </div>

                        <button
                            type="submit"
                            class="btn btn-gold"
                        >
                            Save Assignment
                        </button>

                        <a
                            href="{% url 'countdown' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
